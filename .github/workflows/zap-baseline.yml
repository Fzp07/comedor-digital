name: ZAP baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  escaneo:
    name: Escaneo pasivo OWASP ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baseline contra producción
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://comedor-digital.netlify.app"
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-report
