name: ZAP baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  escaneo:
    name: Escaneo pasivo OWASP ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baseline contra producción
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://comedor-digital.netlify.app"
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: false

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: ignore
          retention-days: 30
